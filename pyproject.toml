[project]
name = "aion2market"
dynamic = ["version"]
description = "Aion 2 market price tracker (passive Npcap capture)"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.6",
    "psutil>=5.9",
    "lz4>=4",
    "cryptography>=42",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]
app = ["pywebview>=5", "pyinstaller>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# Bump the version in src/aion2market/__init__.py; the app UI shows it too.
version = { attr = "aion2market.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aion2market = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # ~300 deliberate long lines (aligned trailing comments, inline data); wrapping them is pure churn
]

[tool.ruff.lint.per-file-ignores]
# Tests name captured log lines `l` in short comprehensions and build tiny fixture rows with a lambda.
"tests/*" = ["E741", "E731"]

[tool.mypy]
files = ["src/aion2market/store.py", "src/aion2market/dashboard.py"]
mypy_path = "src"
ignore_missing_imports = true
# Use the rest of the package for types, but report errors only in the files listed above.
follow_imports = "silent"
